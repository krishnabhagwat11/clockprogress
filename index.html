<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Year Progress Clock</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="shell" aria-label="Year progress clock">
    <div class="top-date" id="day-date">—</div>
    <div class="clock" id="time">00:00</div>
    <div class="grid-wrap">
      <div class="dot-grid" id="dot-grid" aria-label="Year progress dots"></div>
    </div>
    <div class="footer" id="footer">—</div>
  </main>

  <script src="app.js" defer></script>
</body>
</html>
